name: CI

on:
  push:
    branches: [ main, features ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./internal/... -v

      - name: Migrate
        run: |
          mkdir -p storage
          rm -f ./storage/auth.db
          STORAGE_PATH=./storage/auth.db MIGRATIONS_PATH=./migrations go run ./cmd/migrator
          STORAGE_PATH=./storage/auth.db MIGRATIONS_PATH=./tests/migrations MIGRATIONS_TABLE=migrations_test go run ./cmd/migrator

      - name: Start server
        run: go run ./cmd/auth --config=./config/local.yaml &

      - name: Wait for gRPC port
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/40049) >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "сервер не поднялся на :40049"; exit 1

      - name: Integration tests
        run: go test ./tests/... -v
